# Installers (PK-01): per-user NSIS on Windows, AppImage and .deb on Linux. PK-04: a notarised .dmg on macOS.
appId: dev.mapexit.ade
productName: ADE
copyright: Copyright © 2026 MapexIT
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: ../../packages/shell-integration/scripts
    to: shell-integration
  - from: resources/icon.png
    to: icon.png
# The ACP adapters and node-pty are spawned or loaded from disk, so they stay outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@agentclientprotocol/**
  - node_modules/@anthropic-ai/**
  - node_modules/@openai/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # Signing (PK-03): provide WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD in the environment. Never commit them.
  signtoolOptions:
    publisherName: MapexIT
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ADE-Setup-${version}.${ext}
linux:
  target: [AppImage, deb]
  # The default comes from the package name (@ade/desktop), which electron-builder rejects as a file name.
  executableName: ade
  category: Development
  icon: resources/icon.png
  maintainer: MapexIT
  artifactName: ADE-${version}-${arch}.${ext}
deb:
  depends: [git]
# PK-04: a .dmg for Apple silicon, and a .zip that electron-updater uses to update in place. Intel Macs are not
# built: pnpm installs only the build machine's platform packages, so an x64 app would lack the darwin-x64
# binaries the Claude Code and Codex adapters need.
# Signing uses CSC_LINK and CSC_KEY_PASSWORD (a Developer ID Application certificate). Notarisation runs when
# APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set (electron-builder 26 with @electron/notarize).
# Never commit any of them.
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: ADE-${version}-${arch}.${ext}
dmg:
  artifactName: ADE-${version}-${arch}.${ext}
# Self-update (PK-03): electron-updater reads this feed. AppImage and NSIS update in place; .deb installs get
# a "new version available" notice. Point `url` at the release host before the first public build.
publish:
  provider: generic
  url: https://example.invalid/ade/releases
