# Installers (PK-01): per-user NSIS on Windows, AppImage and .deb on Linux. macOS (.dmg) follows in v1.
appId: dev.mapexit.ade
productName: ADE
copyright: Copyright © 2026 MapexIT
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: ../../packages/shell-integration/scripts
    to: shell-integration
  - from: resources/icon.png
    to: icon.png
# The ACP adapters and node-pty are spawned or loaded from disk, so they stay outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@agentclientprotocol/**
  - node_modules/@anthropic-ai/**
  - node_modules/@openai/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # Signing (PK-03): provide WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD in the environment. Never commit them.
  signtoolOptions:
    publisherName: MapexIT
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ADE-Setup-${version}.${ext}
linux:
  target: [AppImage, deb]
  category: Development
  icon: resources/icon.png
  maintainer: MapexIT
  artifactName: ADE-${version}-${arch}.${ext}
deb:
  depends: [git]
# Self-update (PK-03): electron-updater reads this feed. AppImage and NSIS update in place; .deb installs get
# a "new version available" notice. Point `url` at the release host before the first public build.
publish:
  provider: generic
  url: https://example.invalid/ade/releases
