name: Package macOS

# PK-04: builds the macOS .dmg and .zip on demand only (never on push), so ordinary CI stays cheap.
# Signed and notarised when these repository secrets exist; otherwise an unsigned build for testing:
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD           Developer ID Application certificate (base64 .p12) and password
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key for notarisation
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build the .dmg
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Install scripts run here: electron-builder needs the Electron binary. node-pty ships darwin prebuilds.
      - run: pnpm install --frozen-lockfile
      - name: Write the App Store Connect key
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Secrets that are not set still arrive as empty strings; electron-builder would treat an empty CSC_LINK
        # as a path, so empty values are removed and the build is unsigned.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          pnpm --filter @ade/desktop dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ade-macos
          path: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.zip
          retention-days: 7
          if-no-files-found: error
